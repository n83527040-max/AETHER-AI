name: Broker CI

on:
  push:
    branches: [ "arena/eb94c696-aether-ai" ]
    paths:
      - "services/broker/**"
      - ".github/workflows/broker-ci.yml"
  pull_request:
    paths:
      - "services/broker/**"

permissions:
  contents: read

concurrency:
  group: broker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, Deno check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/broker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"

      - name: Install dev dependencies
        run: npm ci

      - name: TypeScript typecheck (strict)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Deno type check
        run: deno check src/main.ts
